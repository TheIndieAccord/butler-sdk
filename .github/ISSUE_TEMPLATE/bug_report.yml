name: Bug report
description: Something in an SDK, the spec or the docs does not work as described.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [TypeScript, Unity, GameMaker, Spec or fixtures, Docs, Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version and engine version
      placeholder: "@indieaccord/butler 2.0.1 on Chrome 131, or com.indieaccord.butler 2.0.0 on Unity 6000.0.40f1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or a small code sample
      description: Remove any keys or tokens before pasting.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Debug log (optional)
      description: Turn on debug logging in the SDK and paste the relevant lines. Remove keys first.
      render: text
