<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="735" viewBox="0 0 1000 735" role="img" aria-labelledby="title desc"><title id="title">Butler public integration map</title><desc id="desc">Three separate paths: game analytics through Doorman to Butler; game sign-in through the system browser with PKCE; and verified game actions through your server to Butler. Backstairs configures integrations outside these runtime paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7a5c25"/></marker></defs><rect width="1000" height="735" fill="#f4f0e8"/><text x="40" y="46" font-family="Georgia, serif" font-size="32" fill="#1f1c17">Three ways into Butler</text><text x="40" y="77" font-family="Arial, sans-serif" font-size="17" fill="#554e43">Choose the credential that matches the work.</text><text x="40" y="119" font-family="Arial, sans-serif" font-size="13" fill="#7a5c25">01  CLIENT ANALYTICS</text><rect x="40" y="136" width="255" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="60" y="170" font-family="Georgia, serif" font-size="21" fill="#1f1c17">Your game</text><text x="60" y="201" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Optional SDK or HTTP</text><text x="60" y="226" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Publishable ingest key</text><rect x="385" y="136" width="220" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="405" y="170" font-family="Georgia, serif" font-size="21" fill="#1f1c17">Doorman</text><text x="405" y="201" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Holds backend secrets</text><text x="405" y="226" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Signs upstream requests</text><rect x="695" y="136" width="265" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="715" y="170" font-family="Georgia, serif" font-size="21" fill="#1f1c17">Butler analytics</text><text x="715" y="201" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Receives gameplay events</text><text x="715" y="226" font-family="Arial, sans-serif" font-size="16" fill="#554e43">No reward authority</text><path d="M300 195 L378 195" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 195 L688 195" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="303" font-family="Arial, sans-serif" font-size="13" fill="#7a5c25">02  PLAYER SIGN-IN</text><rect x="40" y="320" width="255" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="60" y="354" font-family="Georgia, serif" font-size="21" fill="#1f1c17">Your game</text><text x="60" y="385" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Public OAuth client id</text><text x="60" y="410" font-family="Arial, sans-serif" font-size="16" fill="#554e43">PKCE + callback checks</text><rect x="385" y="320" width="220" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="405" y="354" font-family="Georgia, serif" font-size="21" fill="#1f1c17">System browser</text><text x="405" y="385" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Player signs in</text><text x="405" y="410" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Player approves access</text><rect x="695" y="320" width="265" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="715" y="354" font-family="Georgia, serif" font-size="21" fill="#1f1c17">Butler</text><text x="715" y="385" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Code exchanged for token</text><text x="715" y="410" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Player-scoped profile</text><path d="M300 379 L378 379" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 379 L688 379" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="487" font-family="Arial, sans-serif" font-size="13" fill="#7a5c25">03  TRUSTED GAME FEATURES</text><rect x="40" y="504" width="255" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="60" y="538" font-family="Georgia, serif" font-size="21" fill="#1f1c17">Your game</text><text x="60" y="569" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Your game protocol</text><text x="60" y="594" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Authenticated session</text><rect x="385" y="504" width="220" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="405" y="538" font-family="Georgia, serif" font-size="21" fill="#1f1c17">Your server</text><text x="405" y="569" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Verifies player + action</text><text x="405" y="594" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Keeps client secret</text><rect x="695" y="504" width="265" height="120" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="715" y="538" font-family="Georgia, serif" font-size="21" fill="#1f1c17">Butler game API</text><text x="715" y="569" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Accolades, feats, saves</text><text x="715" y="594" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Server-authorized writes</text><path d="M300 563 L378 563" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 563 L688 563" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="669" font-family="Arial, sans-serif" font-size="17" fill="#554e43">Backstairs configures integrations and keys; it is not a per-event runtime hop.</text><text x="40" y="699" font-family="Arial, sans-serif" font-size="17" fill="#7a5c25">Client analytics is untrusted input. Server secrets never belong in a shipped game.</text></svg>
