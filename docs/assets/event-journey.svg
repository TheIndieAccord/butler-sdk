<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img" aria-labelledby="title desc"><title id="title">Intended analytics delivery lifecycle</title><desc id="desc">Consent gates network activity. Config and sampling govern sending. Events retain ids in a bounded queue. Delivery through Doorman yields per-event outcomes. Transient failures require backoff and the same ids; rejected items are not retried.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7a5c25"/></marker></defs><rect width="1000" height="615" fill="#f4f0e8"/><text x="40" y="46" font-family="Georgia, serif" font-size="32" fill="#1f1c17">From gameplay to an event</text><text x="40" y="77" font-family="Arial, sans-serif" font-size="17" fill="#554e43">Intended SDK behavior. Handwritten HTTP must supply its own delivery controls.</text><rect x="40" y="115" width="270" height="125" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="60" y="149" font-family="Georgia, serif" font-size="21" fill="#1f1c17">1. Consent</text><text x="60" y="180" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Consent gates requests.</text><text x="60" y="205" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Revocation clears the queue.</text><rect x="365" y="115" width="270" height="125" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="385" y="149" font-family="Georgia, serif" font-size="21" fill="#1f1c17">2. Config + sampling</text><text x="385" y="180" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Check enabled + sample rates.</text><text x="385" y="205" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Fetch only after consent.</text><rect x="690" y="115" width="270" height="125" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="710" y="149" font-family="Georgia, serif" font-size="21" fill="#1f1c17">3. Bounded queue</text><text x="710" y="180" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Give each event one id.</text><text x="710" y="205" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Reuse the id for retries.</text><path d="M315 177 L358 177" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 177 L683 177" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 245 L825 305" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="312" width="270" height="125" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="710" y="346" font-family="Georgia, serif" font-size="21" fill="#1f1c17">4. Deliver</text><text x="710" y="377" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Game to Doorman to Butler.</text><text x="710" y="402" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Respect the batch limit.</text><rect x="365" y="312" width="270" height="125" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="385" y="346" font-family="Georgia, serif" font-size="21" fill="#1f1c17">5. Inspect results</text><text x="385" y="377" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Read each event result.</text><text x="385" y="402" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Check the body, not just HTTP.</text><path d="M684 374 L641 374" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="312" width="270" height="125" rx="8" fill="#fbf8f2" stroke="#7a5c25"/><text x="60" y="346" font-family="Georgia, serif" font-size="21" fill="#1f1c17">6. Resolve</text><text x="60" y="377" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Accepted / duplicate: remove.</text><text x="60" y="402" font-family="Arial, sans-serif" font-size="16" fill="#554e43">Rejected: do not retry.</text><path d="M359 374 L316 374" fill="none" stroke="#7a5c25" stroke-width="2" marker-end="url(#arrow)"/><path d="M965 374 H982 V276 H875 V245" fill="none" stroke="#7a5c25" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="40" y="529" font-family="Arial, sans-serif" font-size="17" fill="#554e43">Transient failure: backoff, honor Retry-After, reuse ids.</text><text x="40" y="578" font-family="Arial, sans-serif" font-size="17" fill="#7a5c25">Delivery controls protect the game loop. They do not turn analytics into trusted achievements.</text></svg>
